# ============================================================
# integrated_qa_system — 基础设施服务
# 启动: docker compose up -d
# 停止: docker compose down
# ============================================================

services:
  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: iqs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-subjects_kg}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d  # 可选：初始化 SQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iqs-net

  # ========== Redis 7 ==========
  redis:
    image: redis:7-alpine
    container_name: iqs-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-1234}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-1234}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iqs-net

  # ========== Milvus 依赖: etcd ==========
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: iqs-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      TZ: Asia/Shanghai
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - iqs-net

  # ========== Milvus 依赖: MinIO ==========
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: iqs-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - iqs-net

  # ========== Milvus Standalone 2.4 ==========
  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: iqs-milvus
    restart: unless-stopped
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      TZ: Asia/Shanghai
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - iqs-net

  # ========== Application ==========
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iqs-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # config.ini 通过 volume 挂载（不入镜像、不入 git）
      - ./config.ini:/app/config.ini:ro
      - models_data:/app/rag_qa/models
      - logs_data:/app/logs
      - checkpoints_data:/app/checkpoints
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    profiles:
      - dev
      - prod
    networks:
      - iqs-net

# ========== 持久化卷 ==========
volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  models_data:
  logs_data:
  checkpoints_data:

# ========== 网络 ==========
networks:
  iqs-net:
    driver: bridge
